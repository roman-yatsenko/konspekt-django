{% extends "konspekt/base.html" %}

{% block content %}
  <h2>
    <a href="{% url 'konspekt:topic' topic.id %}">{{ topic }}</a>
  </h2>

  <h3>Нова нотатка до теми</h3>
  <form action="{% url 'konspekt:new_note' topic.id %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Додати нотатку</button>
  </form>
{% endblock content %}
